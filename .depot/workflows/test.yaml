# Depot CI Migration
# Source: .github/workflows/deploy.yaml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Test

on: push
jobs:
  read-oidc:
    name: Read OIDC
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    permissions:
      id-token: write
      contents: read # required for actions/checkout

    steps:
      - name: Decode Depot OIDC token
        shell: bash
        run: |
          set -euo pipefail
          CA_FILE="./k3s-ca.crt"

          echo ${{ secrets.K8S_CA_B64 }} | base64 --decode > "$CA_FILE"

          # Get the OIDC token
          response="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              --data-urlencode "audience=k3s-homelab"
          )"

          OIDC_TOKEN="$(jq -r '.value' <<< "$response")"
          API_SERVER="https://${{ secrets.K8S_SERVER }}"

          tailscale ping --timeout 10s $API_SERVER
          for i in $(seq 1 30); do
            state="$(tailscale status --json 2>/dev/null | jq -r '.BackendState')"
            echo "Tailscale state: ${state:-unknown} ($i)"
            if [ "$state" = "Running" ]; then
              break
            fi
            sleep 2
          done
          tailscale status

          # use it generate a token for depot-deploy SA
          DEPLOYER_TOKEN="$(
            kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$OIDC_TOKEN" \
            --namespace="default" \
            create token depot-deployer \
            --duration=10m \
            --audience="https://kubernetes.default.svc"
          )"
          
          kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$DEPLOYER_TOKEN" \
            --namespace="default" \
            get deploy website-blog

