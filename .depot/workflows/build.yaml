# Depot CI Migration
# Source: .github/workflows/deploy.yaml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Test-Build-Depoly

on: push
jobs:
  run-test:
    name: Run Tests
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: uv run pytest

  build-container:
    name: Build Website Blog Container
    needs: run-test
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    permissions:
      # required for allowing the workflow to request and use an OIDC token for an action or step
      # specifically, we need the below set for depot/build-push-action@v1
      id-token: write
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v6
      - uses: depot/setup-action@v1

      - name: Login to Depot Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: x-token
          password: ${{ secrets.DEPOT_TOKEN }}

      - name: Build image
        uses: depot/build-push-action@v1
        env:
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
        with:
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
  deploy:
    name: Deploy to K3s
    needs: build-container
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-latest
    
    steps:
      - name: Deploy New Container to K3s
        run: |
          set -euo pipefail
          CA_FILE="./k3s-ca.crt"

          echo ${{ secrets.K8S_CA_B64 }} | base64 --decode > "$CA_FILE"

          # Get the OIDC token
          response="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              --data-urlencode "audience=k3s-homelab"
          )"

          OIDC_TOKEN="$(jq -r '.value' <<< "$response")"
          API_SERVER="https://${{ secrets.K8S_SERVER }}"

          for i in $(seq 1 30); do
            state="$(tailscale status --json 2>/dev/null | jq -r '.BackendState')"
            echo "Tailscale state: ${state:-unknown} ($i)"
            if [ "$state" = "Running" ]; then
              break
            fi
            sleep 2
          done

          # use it generate a token for depot-deploy SA
          DEPLOYER_TOKEN="$(
            kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$OIDC_TOKEN" \
            --namespace="default" \
            create token depot-deployer \
            --duration=10m \
            --audience="k3s"
          )"
          
          # test to make sure we can access the deployment we want to modify
          kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$DEPLOYER_TOKEN" \
            --namespace="default" \
            get deploy website-blog

          kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$DEPLOYER_TOKEN" \
            --namespace="default" \
            set image deployment/website-blog \
            website-blog=${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}


          if kubectl \
            --server="$API_SERVER" \
            --certificate-authority="$CA_FILE" \
            --token="$DEPLOYER_TOKEN" \
            --namespace="default" \
            rollout status deployment/website-blog --timeout=5m
          then
            echo "Rollout succeeded"
          else
            ROLLOUT_STATUS=$?

            echo "Rollout failed with status $ROLLOUT_STATUS; rolling back"
            kubectl --kubeconfig "$KUBECONFIG_FILE" -n default rollout undo deployment/website-blog
            exit "$ROLLOUT_STATUS"
          fi
