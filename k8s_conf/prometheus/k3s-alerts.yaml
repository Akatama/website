# k3s-alerts.yaml
# Alert rules designed for K3s clusters in production

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k3s-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: k3s-cluster-health
      rules:
        - alert: K3s_HighCPU_Usage
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle", job="node-exporter"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage has been above 85% for 10 minutes."

        - alert: K3s_Super_High_CPU_Usage
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle", job="node-exporter"}[5m])) * 100) >= 95
          for: 10m
          labels:
            severity: critical
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Super high CPU usage on {{ $labels.instance }}"
            description: "CPU usage has been at or above 95% for 10 minutes."

        - alert: K3s_Low_Memory
          expr: (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 < 15
          for: 5m
          labels:
            severity: warning
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Low memory on {{ $labels.instance }}"
            description: "Available memory is below 15%."

        - alert: K3s_Super_Low_Memory
          expr: (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 <= 5
          for: 5m
          labels:
            severity: critical
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Super low memory on {{ $labels.instance }}"
            description: "Available memory is at or below 5%."

        - alert: K3s_Disk_Space_Low
          expr: (node_filesystem_avail_bytes{mountpoint="/", job="node-exporter"} / node_filesystem_size_bytes{mountpoint="/", job="node-exporter"}) * 100 < 20
          for: 10m
          labels:
            severity: warning
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Low disk space on {{ $labels.instance }}"
            description: "Disk space is below 20% on root filesystem."

        - alert: K3s_Disk_Space_Super_Low
          expr: (node_filesystem_avail_bytes{mountpoint="/", job="node-exporter"} / node_filesystem_size_bytes{mountpoint="/", job="node-exporter"}) * 100 < 2
          for: 10m
          labels:
            severity: critical
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Super low disk space on {{ $labels.instance }}"
            description: "Disk space is below 2% on root filesystem."

        - alert: K3s_Pod_Restarting_Too_Often
          expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[1h])) > 5
          for: 5m
          labels:
            severity: warning
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
            description: "Pod has restarted more than 5 times in the last hour."

        - alert: K3s_API_Server_Latency_High
          expr: histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!="WATCH"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
            ntfy_group: k3s-cluster-health
            namespace: monitoring
          annotations:
            summary: "K3s API server latency is high"
            description: "99th percentile API latency is above 1 second."

        # Uncomment to test integration with ntfy or whatever
        # - alert: K3s_Test_Alert_Cluster_Health
        #   expr: vector(1)
        #   labels:
        #     severity: warning
        #     ntfy_group: k3s-cluster-health
        #     namespace: monitoring
        #   annotations:
        #     summary: "Temporary alert test"
        #     description: "Remove this rule after confirming the notification arrives."

    - name: k3s-workload-health
      rules:
        - alert: K3s_Deployment_Unavailable
          expr: kube_deployment_status_replicas_available == 0
          for: 5m
          labels:
            severity: critical
            ntfy_group: k3s-workload-health
            namespace: monitoring
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"
            description: "All replicas are unavailable for this deployment."

        - alert: K3s_Pod_Pending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
            ntfy_group: k3s-workload-health
            namespace: monitoring
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is pending"
            description: "Pod has been in Pending state for more than 15 minutes."

        # Uncomment to test integration with ntfy or whatever
        # - alert: K3s_Test_Alert_Workload_Health
        #   expr: vector(1)
        #   labels:
        #     severity: warning
        #     ntfy_group: k3s-workload-health
        #     namespace: monitoring
        #   annotations:
        #     summary: "Temporary alert test"
        #     description: "Remove this rule after confirming the notification arrives."

    - name: k3s-backups
      rules:
        - alert: Postgres_Backup_Failed
          expr: (kube_job_failed{namespace="default", job="kube-state-metrics", condition="true"} == 1) and on (namespace, job_name) kube_job_owner{namespace="default", job="kube-state-metrics", owner_kind="CronJob", owner_name="postgres-backup"}
          for: 1m
          labels:
            severity: critical
            ntfy_group: k3s-backups
            namespace: monitoring
          annotations:
            summary: "Postgres backup Job failed"
            description: "The postgres-backup CronJob is in a failed state."

        - alert: Postgres_Backup_Not_Run_8_Days
          expr: time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="postgres-backup", job="kube-state-metrics"} > 691200
          for: 5m
          labels:
            severity: critical
            ntfy_group: k3s-backups
            namespace: monitoring
          annotations:
            summary: "Postgres backup has not run in 8 days"
            description: "The postgres-backup CronJob has not completed successfully in over 8 days."

        # Uncomment to test integration with ntfy or whatever
        # - alert: K3s_Test_Alert_Backups
        #   expr: vector(1)
        #   labels:
        #     severity: warning
        #     ntfy_group: k3s-backups
        #     namespace: monitoring
        #   annotations:
        #     summary: "Temporary alert test"
        #     description: "Remove this rule after confirming the notification arrives."


