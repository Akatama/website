apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: depot-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get", "patch", "update"]
